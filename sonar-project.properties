sonar.projectKey=portfolio
sonar.projectName=portfolio
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests
sonar.exclusions=external/**,public/**,bin/**,.work/**,build/**,mocks/**,assets/fonts/**,assets/img/**,assets/education/**,assets/css/vendor/**,templates/partials/postitem.html,tests/**
sonar.cxx.cppcheck.reportPaths=build/report/cppcheck-report.xml
sonar.cxx.clangtidy.reportPaths=build/report/clang-tidy-report.txt
sonar.cxx.flawfinder.reportPaths=build/report/flawfinder-report.txt
sonar.cxx.cobertura.reportPaths=build/report/coverage.xml
sonar.cxx.includeDirectories=tools,external/stb
sonar.cxx.errorRecoveryEnabled=true
sonar.cxx.file.suffixes=.c,.h
