        <section class="tag-page">
            <div class="tag-info">
                <p>@@tag.tagged_with@@ "@@tag@@":</p>
                <a class="back-link" href="/@@lang@@/@@slug.blog@@/">@@tag.view_all@@</a>
            </div>
            <ul class="posts-list">
            <nav data-sblg-nav="1" data-sblg-navtag="@@tag@@" data-sblg-navstyle-content="keep" data-sblg-navstyle-element="discard">
            @@post_item@@
            </nav>
            </ul>
        </section>
